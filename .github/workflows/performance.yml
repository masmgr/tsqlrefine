name: performance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json

      - name: Run lint benchmark
        run: dotnet run --project benchmarks/TsqlRefine.Benchmarks -c Release -- --filter '*'

      - name: Restore benchmark history
        uses: actions/cache@v6
        with:
          path: .benchmark-cache
          key: benchmark-${{ runner.os }}

      - name: Check performance regression
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: benchmarkdotnet
          output-file-path: BenchmarkDotNet.Artifacts/results/TsqlRefine.Benchmarks.LintBenchmarks-report-full-compressed.json
          external-data-json-path: .benchmark-cache/benchmark-data.json
          alert-threshold: '150%'
          fail-on-alert: true

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts
