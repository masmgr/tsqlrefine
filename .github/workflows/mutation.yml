name: mutation

on:
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/TsqlRefine.Core/**'
      - 'src/TsqlRefine.Formatting/**'
      - 'src/TsqlRefine.Rules/**'
      - 'tests/TsqlRefine.Core.Tests/**'
      - 'tests/TsqlRefine.Formatting.Tests/**'
      - 'tests/TsqlRefine.Rules.Tests/**'
      - 'stryker*-config.json'

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [rules, core, formatting]
        include:
          - component: rules
            config: stryker-config.json
          - component: core
            config: stryker-core-config.json
          - component: formatting
            config: stryker-formatting-config.json
    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json

      - name: Install Stryker.NET
        run: dotnet tool install --global dotnet-stryker --version 4.16.0

      - name: Run full mutation tests
        if: github.event_name != 'pull_request'
        run: dotnet stryker --config-file "${{ matrix.config }}"

      - name: Run changed-code mutation tests
        if: github.event_name == 'pull_request'
        run: dotnet stryker --config-file "${{ matrix.config }}" --since:${{ github.event.pull_request.base.sha }}

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report-${{ matrix.component }}
          path: StrykerOutput
